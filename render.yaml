services:
  - type: web
    name: sindi-gradebook
    runtime: ruby
    plan: free
    buildCommand: ./bin/render-build.sh
    startCommand: bundle exec puma -C config/puma.rb
    healthCheckPath: /up
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sindi-gradebook-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: RAILS_MAX_THREADS
        value: "3"
      - key: SEED_DEMO_DATA
        value: "true"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: sindi-gradebook-db
    plan: free
    databaseName: gradebook
    user: gradebook
